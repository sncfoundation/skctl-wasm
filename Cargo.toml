[package]
name = "skctl-wasm"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "skctl CLI compiled to WebAssembly — kubectl-in-the-browser for Sheeternetes"
repository = "https://github.com/sncfoundation/skctl-wasm"

[lib]
# cdylib is required for the wasm target; rlib keeps `cargo test` on host usable.
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
